# CI for the public single-store repository. This file is shipped by the
# export (oss/workflows/ci.yml in the private repo); edit it there.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, unit tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm lint

  build:
    name: Migrate and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: niblr_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/niblr_ci
      PAYLOAD_SECRET: ci-only-not-a-secret
      NEXT_PUBLIC_ROOT_DOMAIN: localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The shipped migration must bring an empty database to the current schema.
      - name: Migrate
        run: pnpm payload migrate
      - name: Build
        run: pnpm build
      - name: Install Chromium for the smoke suite
        run: npx playwright install --with-deps chromium
      # Starts the production server against the migrated database, creates the
      # first user, the store settings and a product, then walks the storefront.
      - name: Smoke
        run: pnpm test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-report
          path: playwright-report
          retention-days: 7
